name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: linux-amd64
          - os: ubuntu-24.04-arm
            triplet: linux-arm64
          - os: macos-15-intel
            triplet: darwin-amd64
          - os: macos-15
            triplet: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Go is needed only for the macOS builds; Linux builds use the
      # golang-alpine container's bundled toolchain.
      - name: Set up Go (Darwin)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache libtokenizers.a
        uses: actions/cache@v4
        with:
          path: lib
          key: libtokenizers-${{ matrix.triplet }}-v1.27.0-${{ runner.os == 'Linux' && 'musl' || 'native' }}

      # ---- Linux: build a fully static, glibc-independent binary inside
      # an alpine container so the artifact runs on any Linux distro.
      - name: Build (Linux musl static)
        if: runner.os == 'Linux'
        run: |
          musl_triplet="$(echo '${{ matrix.triplet }}' | sed 's/linux-/linux-musl-/')"
          host_uid=$(id -u)
          host_gid=$(id -g)
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e TOKENIZERS_TRIPLET="$musl_triplet" \
            -e STATIC=1 \
            golang:1.24-alpine \
            sh -c "
              apk add --no-cache make tar curl bash git build-base &&
              git config --global --add safe.directory /src &&
              make build &&
              chown -R ${host_uid}:${host_gid} /src
            "

      - name: Build (Darwin native)
        if: runner.os == 'macOS'
        run: make build

      - name: Smoke test
        shell: bash
        run: |
          echo "The quick brown fox jumps over the lazy dog." > smoke.txt
          out=$(./tok openai/gpt-4o smoke.txt)
          echo "tok output: $out"
          test "$out" -eq 10
          ls -la tok
          file tok || true

      - name: Archive
        shell: bash
        run: |
          mkdir -p dist
          archive="tok-${GITHUB_REF_NAME}-${{ matrix.triplet }}.tar.gz"
          tar -czf "dist/${archive}" tok README.md .env.example
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tok-${{ matrix.triplet }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
